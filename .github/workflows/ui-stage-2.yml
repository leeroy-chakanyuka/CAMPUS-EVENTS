name: Stage 2 Student Browse proof

on:
  pull_request:
    paths:
      - "swing-frontend/swing-frontend/**"
      - ".github/workflows/ui-stage-2.yml"
  workflow_dispatch:

jobs:
  build-test-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: swing-frontend/swing-frontend/pom.xml
      - name: Compile all main and smoke-check classes
        run: mvn --batch-mode -f swing-frontend/swing-frontend/pom.xml clean test-compile
      - name: Build test classpath
        run: mvn --batch-mode -q -f swing-frontend/swing-frontend/pom.xml dependency:build-classpath -Dmdep.outputFile=${{ runner.temp }}/stage2-cp.txt -DincludeScope=test
      - name: Run browse regression assertions
        run: |
          CP="swing-frontend/swing-frontend/target/test-classes:swing-frontend/swing-frontend/target/classes:$(cat ${{ runner.temp }}/stage2-cp.txt)"
          java -ea -cp "$CP" za.ac.cput.Stage2BrowseChecks
      - name: Capture actual Swing views with fixture API
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          CP="swing-frontend/swing-frontend/target/test-classes:swing-frontend/swing-frontend/target/classes:$(cat ${{ runner.temp }}/stage2-cp.txt)"
          xvfb-run -a -s "-screen 0 1440x900x24" java --add-modules jdk.httpserver -cp "$CP" za.ac.cput.Stage1Capture
      - name: Upload real rendered screenshots
        uses: actions/upload-artifact@v4
        with:
          name: campus-events-stage-2-swing-screenshots
          path: ui-stage-1-shots/*.png
          if-no-files-found: error
